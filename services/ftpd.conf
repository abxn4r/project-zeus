# Service Registry Definition: Dedicated PhotoSync FTP Server
NAME="ftpd"
PROCESS="photo_ftp_server.py"
START="export PATH=/data/local/server/bin:/data/data/com.termux/files/usr/bin:/system/bin:/system/xbin:\$PATH; python3 /data/local/server/bin/photo_ftp_server.py > /data/local/server/logs/ftpd.log 2>&1 &"
STOP="pkill -f 'photo_ftp_server.py'"
CHECK_PORT=2121
ENABLED=1
MAX_FAILURES=3
WINDOW_SECONDS=60
