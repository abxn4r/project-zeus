# Service Registry Definition: Hermes AI Agent Gateway
NAME="hermes"
PROCESS="hermes gateway run"
START="export HOME=/data/data/com.termux/files/home; export HERMES_TELEGRAM_DISABLE_FALLBACK_IPS=true; export SSL_CERT_FILE=/data/data/com.termux/files/usr/etc/tls/cert.pem; export REQUESTS_CA_BUNDLE=/data/data/com.termux/files/usr/etc/tls/cert.pem; export PATH=/data/local/server/bin:/data/data/com.termux/files/usr/bin:/system/bin:/system/xbin:\$PATH; /data/local/server/apps/hermes-agent/venv/bin/hermes gateway run >/data/local/server/logs/hermes.log 2>&1 &"
STOP="pkill -f 'hermes gateway run'"
ENABLED=0
MAX_FAILURES=3
WINDOW_SECONDS=60
