# Service Registry Definition: Tactical Phosphor Green Matrix HUD Dashboard
NAME="dashboard"
PROCESS="node server.js"
START="cd /data/local/server/apps/zeus-dashboard && node server.js >/data/local/server/logs/dashboard.log 2>&1 &"
STOP="pkill -f 'node server.js'"
CHECK_PORT=8080
ENABLED=1
MAX_FAILURES=3
WINDOW_SECONDS=60
