# Service Registry Definition: Tailscale Mesh VPN Daemon
NAME="tailscale"
PROCESS="tailscaled"
START="export XDG_CACHE_HOME=/data/local/server/cache; export HOME=/data/local/server; mkdir -p /data/local/server/config/tailscale /data/local/server/cache; /data/local/server/bin/tailscaled --tun=userspace-networking --state=/data/local/server/config/tailscale/tailscaled.state --socket=/data/local/server/runtime/tailscaled.sock >/dev/null 2>&1 &"
STOP="pkill tailscaled"
ENABLED=0
MAX_FAILURES=3
WINDOW_SECONDS=60
