# Service Registry Definition: OWASP ZAP (Zed Attack Proxy Daemon)
NAME="zap"
PROCESS="zap"
START="export PATH=/data/local/server/bin:/data/data/com.termux/files/usr/bin:/system/bin:/system/xbin:\$PATH; zap -daemon -host 0.0.0.0 -port 8090 -config api.key=\${ZAP_API_KEY:-CHANGE_ME_ZAP_API_KEY} -config api.addrs.addr.name='.*' -config api.addrs.addr.regex=true >/data/local/server/logs/zap.log 2>&1 &"
STOP="pkill -f 'zap.sh' 2>/dev/null; pkill -f 'zap-.*.jar' 2>/dev/null"
CHECK_PORT=8090
ENABLED=0
MAX_FAILURES=3
WINDOW_SECONDS=60
