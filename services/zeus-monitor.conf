# Service Registry Definition: Zeus Social & Cloud Account Monitor Bot
NAME="zeus-monitor"
PROCESS="zeus-monitor/index.js"
START="export PATH=/data/local/server/bin:/data/data/com.termux/files/usr/bin:/system/bin:/system/xbin:\$PATH; export LD_PRELOAD=/data/data/com.termux/files/usr/lib/libtermux-exec.so; node /data/local/server/apps/zeus-monitor/index.js >/data/local/server/logs/monitor.log 2>&1 &"
STOP="pkill -f 'zeus-monitor/index.js'"
ENABLED=0
MAX_FAILURES=3
WINDOW_SECONDS=60
